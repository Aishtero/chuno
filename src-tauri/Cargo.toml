[package]
name = "chuno"
version = "0.2.0"
description = "ChUno — Tactical 3D Chess & Roulette Card Thriller"
authors = ["Buro Ecosystem"]
edition = "2021"

[lib]
name = "chuno_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
