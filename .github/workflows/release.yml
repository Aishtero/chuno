name: Release ChUno

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Run unit tests
        run: npx tsx --test src/core/chuno.test.ts

      - name: Build production bundle
        run: npm run build

      - name: Package release archive and SHA256 checksums
        shell: bash
        run: |
          ARCHIVE="chuno-web-${GITHUB_REF_NAME}.zip"
          (cd dist && zip -r "../${ARCHIVE}" .)
          sha256sum "${ARCHIVE}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            chuno-web-*.zip
            SHA256SUMS.txt
