name: Release ChUno Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build web frontend
        run: npm run build

  build-desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target_name: windows
            bundles: nsis,msi
          - platform: ubuntu-22.04
            target_name: linux
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Tauri desktop installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Collect Windows installers
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-stage | Out-Null
          Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" -Filter "*.exe" | Copy-Item -Destination "release-stage"
          Get-ChildItem -Path "src-tauri\target\release\bundle\msi" -Filter "*.msi" | Copy-Item -Destination "release-stage"
          Get-ChildItem -Path "release-stage" | Format-Table Name, Length

      - name: Collect Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p release-stage
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-stage/
          cp src-tauri/target/release/bundle/deb/*.deb release-stage/
          ls -lh release-stage/

      - name: Upload built installers
        uses: actions/upload-artifact@v4
        with:
          name: chuno-installers-${{ matrix.target_name }}
          path: release-stage/*
          if-no-files-found: error

  publish-release:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: chuno-installers-*
          merge-multiple: true
          path: release-assets

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd release-assets
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*
